[project]
name = "mariadb-bottlenect-monitor"
version = "0.1.0"
description = "MariaDB bottleneck monitor with auto-heal"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pymysql>=1.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.11.0",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D100", "D101", "D102", "D103", "D105", "D107", "SIM"]
ignore = ["D100", "D101", "D102", "D103", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D101", "D102", "D103", "D105", "D107"]
